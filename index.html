<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disc Golf Leagues</title>
  <meta name="description" content="Disc golf league dashboards, sponsored by Simplified Workflows.">
  <meta name="theme-color" content="#0b1120">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥏</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif; background: #0b1120; color: #f8fafc; padding: 24px 16px; box-sizing: border-box;
    }
    h1 {
      font-size: 28px; font-weight: 800; margin: 0 0 24px; text-align: center;
      background: linear-gradient(to right, #34d399, #99f6e4); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .league {
      display: block; width: 100%; max-width: 360px; padding: 16px 20px; border-radius: 12px; text-decoration: none;
      background: rgba(15, 23, 42, 0.7); border: 1px solid #1e293b; color: #f1f5f9; transition: border-color .15s;
    }
    .league:hover { border-color: #34d399; }
    .league strong { display: block; font-size: 16px; }
    .league span { font-size: 12px; color: #94a3b8; }
    footer { margin-top: 40px; font-size: 11px; color: #64748b; }
    footer a { color: #34d399; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <h1>🥏 Disc Golf Leagues</h1>
  <a class="league" href="/fairwayfriends/">
    <strong>Fairway Friends Fall Circuit</strong>
    <span>Live standings, aces, birdies &amp; awards</span>
  </a>
  <footer>Sponsored by <a href="https://simplifiedworkflows.com" target="_blank" rel="noopener">Simplified Workflows</a></footer>
</body>
</html>
